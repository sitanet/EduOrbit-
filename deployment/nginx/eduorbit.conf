# Rate limiting zones
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name eduorbit.example.com www.eduorbit.example.com;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eduorbit.example.com www.eduorbit.example.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/eduorbit.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eduorbit.example.com/privkey.pem;

    # Include SSL boilerplate
    include /etc/nginx/conf.d/ssl.conf;
    
    # Include Cache boilerplate
    include /etc/nginx/conf.d/cache.conf;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';" always;

    # Gzip and Brotli compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Access and Error logs
    access_log /var/log/nginx/eduorbit.access.log;
    error_log /var/log/nginx/eduorbit.error.log;

    # Serve Static Files
    location /static/ {
        alias /var/www/eduorbit/backend/staticfiles/;
        expires max;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Serve Media Files
    location /media/ {
        alias /var/www/eduorbit/backend/media/;
        expires max;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Pass traffic to Gunicorn
    location / {
        limit_req zone=mylimit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
