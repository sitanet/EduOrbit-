name: eduorbit
description: "EduOrbit - Enterprise Multi-Tenant School Management Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Network
  dio: ^5.4.0
  retrofit: ^4.1.0

  # Storage (Offline-first & Local DB)
  isar: ^3.1.0+1
  isar_generator: ^3.1.0+1
  flutter_secure_storage: ^9.0.0

  # Localization & Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lang/
