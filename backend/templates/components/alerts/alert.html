{% comment %}
Reusable Alert Component
Parameters:
  - type: 'success', 'warning', 'error', 'info' (default: 'info')
  - title: Optional Alert header
  - message: Main alert message
{% endcomment %}
<div class="alert-box alert-{{ type|default:'info' }}" style="
  display: flex; 
  flex-direction: column; 
  gap: var(--spacing-xs); 
  padding: var(--spacing-md); 
  border-radius: var(--radius-md); 
  border-left: 4px solid var(--color-{{ type|default:'info' }});
  background-color: var(--color-{{ type|default:'info' }}-light);
  color: var(--color-{{ type|default:'info' }}-dark, var(--color-text-primary));
  font-size: var(--font-size-sm);
  margin-bottom: var(--spacing-md);
">
  {% if title %}
    <strong style="font-weight: var(--font-weight-semibold);">{{ title }}</strong>
  {% endif %}
  <span>{{ message }}</span>
</div>
