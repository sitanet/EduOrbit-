{# input.html #}
{# Variables: label, name, type, placeholder, error, value #}
<div class="mb-4">
    {% if label %}
    <label for="{{ name }}" class="block mb-2 text-sm font-medium text-slate-900 dark:text-slate-200">
        {{ label }}
    </label>
    {% endif %}
    <input 
        type="{{ type|default:'text' }}" 
        name="{{ name }}" 
        id="{{ name }}" 
        {% if value %}value="{{ value }}"{% endif %}
        class="bg-white border text-slate-900 text-sm rounded-xl focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 transition-shadow shadow-sm dark:bg-slate-800 dark:border-slate-600 dark:placeholder-slate-400 dark:text-slate-900 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500
        {% if error %}border-red-500 focus:ring-red-500 focus:border-red-500 dark:border-red-500 dark:focus:ring-red-500 dark:focus:border-red-500{% else %}border-slate-300{% endif %}" 
        placeholder="{{ placeholder|default:'' }}"
        {% if kwargs %}{{ kwargs|safe }}{% endif %}
    >
    {% if error %}
    <p class="mt-2 text-sm text-red-600 dark:text-red-400"><span class="font-medium">Error!</span> {{ error }}</p>
    {% endif %}
</div>
