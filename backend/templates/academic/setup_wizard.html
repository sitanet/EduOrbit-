{% extends "base/_document.html" %}

{% block title %}Academic Setup Wizard — EduOrbit{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-12 px-4 sm:px-6">
  <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-2xl p-8 shadow-xl relative overflow-hidden">
    
    <!-- Loading Overlay -->
    <div id="provisioning-spinner" class="htmx-indicator absolute inset-0 bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm flex items-center justify-center z-50">
      <div class="flex flex-col items-center gap-3">
        <svg class="animate-spin h-10 w-10 text-primary" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="text-sm font-semibold text-slate-700 dark:text-slate-350">Registering school calendar...</span>
      </div>
    </div>

    <!-- Title Header -->
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-primary-light flex items-center justify-center text-primary text-xl mx-auto mb-3">🛠️</div>
      <h2 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Academic Setup Wizard</h2>
      <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Configure your school's calendar years and terms structure structure.</p>
    </div>

    <!-- HTMX Form -->
    <form hx-post="{% url 'academic_wizard' %}" hx-target="#wizard-errors" hx-indicator="#provisioning-spinner" class="space-y-6">
      {% csrf_token %}
      
      <!-- Select School -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-2">Select Target Campus</label>
        <select name="school_id" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition">
          {% for school in schools %}
            <option value="{{ school.id }}">{{ school.name }}</option>
          {% empty %}
            <option>EduOrbit Demo Academy</option>
          {% endfor %}
        </select>
      </div>

      <!-- Year Title -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-2">Academic Year Title</label>
        <input type="text" name="year_name" placeholder="e.g. 2026/2027 Academic Year" required
               class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-900 dark:text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition">
      </div>

      <!-- Year Code -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-2">Year Code</label>
        <input type="text" name="year_code" placeholder="e.g. 2026-2027" required
               class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-900 dark:text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition">
      </div>

      <div id="wizard-errors" class="text-sm"></div>

      <!-- Submit Button -->
      <button type="submit" class="w-full py-3 bg-primary hover:bg-primary-hover text-white rounded-xl text-sm font-semibold transition duration-150 shadow-lg shadow-primary/30">
        Save &amp; Continue Setup
      </button>
    </form>
  </div>
</div>
{% endblock %}
