<header class="flex-shrink-0 h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-4 sm:px-6 lg:px-8 transition-colors duration-200 sticky top-0 z-10">
    
    <!-- Mobile menu button -->
    <div class="flex items-center md:hidden">
        <button type="button" class="text-slate-500 dark:text-slate-500 hover:text-slate-600 dark:text-slate-600 dark:text-slate-400 dark:hover:text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 rounded-md p-1">
            <span class="sr-only">Open sidebar</span>
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <span class="ml-3 text-lg font-bold text-slate-800 dark:text-slate-900 dark:text-white">EduOrbit</span>
    </div>

    <!-- Global Search -->
    <div class="flex-1 flex justify-center px-2 lg:ml-6 lg:justify-start hidden sm:flex">
        <div class="max-w-lg w-full lg:max-w-xs">
            <label for="search" class="sr-only">Search</label>
            <div class="relative text-slate-600 dark:text-slate-400 focus-within:text-slate-600 dark:focus-within:text-slate-700 dark:text-slate-300">
                <div class="pointer-events-none absolute inset-y-0 left-0 pl-3 flex items-center">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <input id="search" class="block w-full bg-slate-100 dark:bg-slate-700/50 py-2 pl-10 pr-3 border border-transparent rounded-lg leading-5 text-slate-900 dark:text-slate-900 dark:text-white placeholder-slate-500 dark:placeholder-slate-400 focus:outline-none focus:bg-white dark:focus:bg-slate-700 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors duration-200" placeholder="Search students, classes..." type="search" name="search">
            </div>
        </div>
     </div>

    <!-- Right section -->
    <div class="ml-4 flex items-center md:ml-6 space-x-3 sm:space-x-4">
        
        <!-- Theme Selector (🎨) -->
        <div class="relative" x-data="{ open: false }">
            <button @click="open = !open" @click.away="open = false" type="button" class="p-1 rounded-full text-slate-600 dark:text-slate-400 hover:text-slate-500 dark:text-slate-500 dark:hover:text-slate-700 dark:text-slate-300 focus:outline-none transition-colors">
                <span class="sr-only">Choose theme color</span>
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path>
                </svg>
            </button>
            <div x-show="open" x-transition class="origin-top-right absolute right-0 mt-2 w-36 rounded-xl shadow-lg py-1 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 focus:outline-none hidden z-50" :class="{ 'hidden': !open }">
                <button @click="theme = 'indigo'; open = false" class="w-full text-left px-4 py-2 text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-600 flex items-center gap-2 text-slate-700 dark:text-slate-200">
                    <span class="w-2.5 h-2.5 rounded-full bg-indigo-600"></span> Indigo
                </button>
                <button @click="theme = 'emerald'; open = false" class="w-full text-left px-4 py-2 text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-600 flex items-center gap-2 text-slate-700 dark:text-slate-200">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Emerald
                </button>
                <button @click="theme = 'amber'; open = false" class="w-full text-left px-4 py-2 text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-600 flex items-center gap-2 text-slate-700 dark:text-slate-200">
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> Amber
                </button>
                <button @click="theme = 'rose'; open = false" class="w-full text-left px-4 py-2 text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-600 flex items-center gap-2 text-slate-700 dark:text-slate-200">
                    <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Rose
                </button>
                <button @click="theme = 'purple'; open = false" class="w-full text-left px-4 py-2 text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-600 flex items-center gap-2 text-slate-700 dark:text-slate-200">
                    <span class="w-2.5 h-2.5 rounded-full bg-purple-500"></span> Purple
                </button>
            </div>
        </div>

        <!-- Dark Mode Toggle -->
        <button @click="darkMode = !darkMode" type="button" class="p-1 rounded-full text-slate-600 dark:text-slate-400 hover:text-slate-500 dark:text-slate-500 dark:hover:text-slate-700 dark:text-slate-300 focus:outline-none transition-colors">
            <span class="sr-only">Toggle dark mode</span>
            <!-- Sun icon -->
            <svg x-show="darkMode" class="h-6 w-6 hidden" :class="{ 'hidden': !darkMode }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            <!-- Moon icon -->
            <svg x-show="!darkMode" class="h-6 w-6" :class="{ 'hidden': darkMode }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
        </button>

        <!-- Notification Bell -->
        <button type="button" class="relative p-1 rounded-full text-slate-600 dark:text-slate-400 hover:text-slate-500 dark:text-slate-500 dark:hover:text-slate-700 dark:text-slate-300 focus:outline-none transition-colors">
            <span class="sr-only">View notifications</span>
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
            </svg>
            <!-- Badge -->
            <span class="absolute top-1 right-1 block h-2 w-2 rounded-full bg-red-500 ring-2 ring-white dark:ring-slate-800"></span>
        </button>

        <!-- Profile dropdown -->
        <div class="relative" x-data="{ profileOpen: false }">
            <div>
                <button @click="profileOpen = !profileOpen" @click.away="profileOpen = false" type="button" class="max-w-xs flex items-center text-sm rounded-full focus:outline-none" id="user-menu-button" aria-expanded="false" aria-haspopup="true">
                    <span class="sr-only">Open user menu</span>
                    <img class="h-8 w-8 rounded-full object-cover" src="https://ui-avatars.com/api/?name=Admin+User&background=6366f1&color=fff" alt="User avatar">
                    <div class="hidden md:block ml-2 text-left">
                        <p class="text-sm font-medium text-slate-700 dark:text-slate-200">Admin User</p>
                        <p class="text-xs font-medium text-slate-500 dark:text-slate-500 dark:text-slate-600 dark:text-slate-400">Administrator</p>
                    </div>
                    <svg class="hidden md:block ml-1 h-4 w-4 text-slate-600 dark:text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
            </div>

            <!-- Dropdown menu -->
            <div x-show="profileOpen" x-transition:enter="transition ease-out duration-100" x-transition:enter-start="transform opacity-0 scale-95" x-transition:enter-end="transform opacity-100 scale-100" x-transition:leave="transition ease-in duration-75" x-transition:leave-start="transform opacity-100 scale-100" x-transition:leave-end="transform opacity-0 scale-95" class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg py-1 bg-white dark:bg-slate-700 ring-1 ring-black ring-opacity-5 focus:outline-none hidden z-50" :class="{ 'hidden': !profileOpen }" role="menu" aria-orientation="vertical" aria-labelledby="user-menu-button" tabindex="-1">
                <a href="#" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-600 transition-colors" role="menuitem" tabindex="-1">Your Profile</a>
                <a href="#" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-600 transition-colors" role="menuitem" tabindex="-1">Settings</a>
                <a href="#" class="block px-4 py-2 text-sm text-red-600 hover:bg-slate-100 dark:text-red-400 dark:hover:bg-slate-600 transition-colors" role="menuitem" tabindex="-1">Sign out</a>
            </div>
        </div>
    </div>
</header>
