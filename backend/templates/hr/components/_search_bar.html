{% comment %}
Enterprise Search Bar Component with HTMX live search
Usage: {% include 'hr/components/_search_bar.html' with placeholder="Search employees..." target_id="search-results" search_url="/hr/search/" %}
{% endcomment %}
<div class="relative w-full max-w-md">
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
    </div>
    <input type="search"
           name="q"
           placeholder="{{ placeholder|default:'Search...' }}"
           hx-get="{{ search_url|default:'/hr/search/' }}"
           hx-trigger="keyup changed delay:300ms, search"
           hx-target="#{{ target_id|default:'search-results' }}"
           hx-indicator=".search-indicator"
           class="w-full pl-9 pr-10 py-2 bg-slate-100 dark:bg-slate-750 border border-slate-200 dark:border-slate-650 rounded-xl text-sm text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
    <div class="search-indicator htmx-indicator absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
        <svg class="animate-spin h-4 w-4 text-indigo-500" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
    </div>
</div>
